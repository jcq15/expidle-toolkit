[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expidle-toolkit"
version = "0.1.0"
description = "Android minigame toolkit for Exponential Idle"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["Pillow==12.2.0"]

[project.scripts]
expidle = "expidle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
